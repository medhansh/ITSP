# Central configuration for Team DAC's regime-aware trading system.
# Every tunable that experiments touch should live here, not hardcoded in src/.

universe:
  list_path: "data/universe/nifty500_list.csv"
  index_symbol: "NIFTY500"          # broad index used for regime features
  benchmark_symbol: "NIFTY50"       # benchmark for relative-return style features

regime_detection:
  production_regime_source: "gmm"  # WHICH series feeds exposure_by_regime,
                                     # beta_rotation.stress_by_regime, AND (when
                                     # technical_signals.blend.stress_mode: "rigid") the
                                     # technical_momentum blend ladder. This is the single most
                                     # consequential regime-detection setting in this file.
                                     #   "vix_bucket_contemporaneous"  <- CURRENT, default.
                                     #                 Same-day India VIX bucket (see
                                     #                 vix_bucket_regime below) + asymmetric
                                     #                 downgrade hysteresis. Walk-forward tested
                                     #                 against the GMM(4) price-feature regime
                                     #                 (below) and showed a real, if moderate and
                                     #                 small-n, edge -- see
                                     #                 docs/regime_detection_spec.md's "VIX-bucket
                                     #                 regime" section for the full evidence,
                                     #                 including what else was tried (a VIX-
                                     #                 forecasting classifier arm, a GMM+VIX hybrid
                                     #                 gate -- neither chosen) and the caveat on
                                     #                 not pushing min_days_to_downgrade higher
                                     #                 without re-validating.
                                     #   "gmm"       = the original/legacy source: the GMM(4)
                                     #                 price-feature regime (model: block below).
                                     #                 Kept fully available as an explicit
                                     #                 fallback, not deleted -- set this if VIX
                                     #                 data is unavailable or you want to compare
                                     #                 against the pre-VIX-work baseline.
  vix_bucket_regime:                 # only used when production_regime_source: "vix_bucket_contemporaneous"
                                     # -- see src/regime_detection/vix_regime.py's
                                     # build_production_vix_regime and apply_bucket_hysteresis.
    n_buckets: 4                    # FIXED (not swept) at exactly what was walk-forward validated.
                                     # sweep_bucket_counts/choose_bucket_count exist in vix_regime.py
                                     # for research use but are not called in production -- re-run
                                     # that sweep and re-validate via walk-forward before changing
                                     # this, don't just swap in whatever a fresh sweep suggests.
    log_transform: false            # cluster on log(VIX) instead of raw VIX level. Not validated
                                     # as superior -- left at the tested default.
    random_state: 42
    min_days_to_downgrade: 10       # asymmetric hysteresis: a bucket DOWNGRADE only takes effect
                                     # once VIX has stayed at/below the calmer level for this many
                                     # CONSECUTIVE days; a bucket UPGRADE is always accepted
                                     # instantly, no delay. Chosen from a walk-forward sweep across
                                     # 0-72: most folds' own individual improvement plateaued or
                                     # reversed by roughly 10-15, while the aggregate mean kept
                                     # climbing well past that, driven by just one or two folds
                                     # whose extreme values (min_days=72) later produced a fold
                                     # REVERSING sign relative to its own best setting -- a sign of
                                     # overfitting to specific historical years, not a genuinely
                                     # better setting. 10 sits at the edge of the broadly-supported
                                     # range rather than at the (unreliable) aggregate maximum.
                                     # Do not casually raise this without re-running the walk-forward
                                     # sweep and checking the SAME per-fold breakdown, not just the
                                     # aggregate mean.
  lookback_years: 10
  feature_windows:                 # trading-day windows for rolling features
    returns: [5, 21, 63]
    realized_vol: [21, 63]
    breadth: [21]
    range_vol: [21, 63]             # Parkinson/Garman-Klass windows — only used if the
                                     # price CSV has high/low (Parkinson) or open+high+low
                                     # (Garman-Klass) columns; defaults to realized_vol's
                                     # windows if omitted. See features.py.
    volume_zscore: [21, 63]         # only used if the price CSV has a volume column
    obv_trend: [21, 63]             # only used if the price CSV has a volume column
  model:
    type: "gmm"                    # one of: gmm, kmeans, hmm
    n_regimes: 4                   # e.g. low-vol uptrend / high-vol uptrend / low-vol downtrend / high-vol downtrend
    random_state: 42
  vix_proxy_symbol: "INDIAVIX"
  geometric_signal:                 # wedge-product crash-risk feature — see
                                     # src/regime_detection/geometric_signal.py
                                     # for the full write-up AND the caveat on
                                     # the source blog's unverified 16.7%/98%
                                     # claims (do not repeat those numbers
                                     # without independently reproducing them).
    enabled: false                  # off by default until validate_against_known_crises
                                     # has been run on real (not synthetic) data
    window: 60                      # trading days per rolling wedge-volume window
    smoothing_window: 10
    percentile_window: 252          # ~1yr self-relative percentile lookback
    crash_percentile_threshold: 0.15
    sector_price_csv: "data/raw/sector_prices.csv"
    sector_tickers:                 # used by scripts/fetch_data.py sector-prices; VERIFY before relying on them
      IT: "^CNXIT"
      BANK: "^NSEBANK"
      AUTO: "^CNXAUTO"
      PHARMA: "^CNXPHARMA"
      FMCG: "^CNXFMCG"
      METAL: "^CNXMETAL"
      ENERGY: "^CNXENERGY"
      REALTY: "^CNXREALTY"
      FIN_SERVICE: "^CNXFIN"
  factor_dispersion:                 # Alternative/supplementary regime-detection feature — see
                                     # src/regime_detection/factor_dispersion.py's module
                                     # docstring. Motivated by three separate attempts to make the
                                     # price-vol regime label interact more cleverly with stock
                                     # selection (consensus_governor below, regime-conditional
                                     # technical_momentum weighting, and the plain exposure-scaling
                                     # combination itself) all coming back flat-to-negative —
                                     # consistent with (not proof of) price volatility not being
                                     # the right axis for what stock-selection actually needs.
                                     # Requires a pre-built daily factor_dispersion Series (see
                                     # factor_dispersion.compute_cross_sectional_dispersion +
                                     # resample_dispersion_to_daily) passed into
                                     # regime_detection.pipeline.run_pipeline -- these config
                                     # values alone don't build that series; NOT wired into
                                     # scripts/run_full_pipeline.py's orchestration yet, since doing
                                     # so requires fundamentals PIT scoring to run BEFORE regime
                                     # detection instead of after (the current ordering), and that
                                     # reordering hasn't been done/tested yet either.
    enabled: false                  # off by default -- NOT yet validated on real data
    use_price_features: true        # true: ADD dispersion features alongside existing price-vol
                                     # features. false: REPLACE the clustering feature set with
                                     # ONLY factor_dispersion features -- the "alternative
                                     # framework" mode (refit regime detection on cross-sectional
                                     # factor-score spread INSTEAD OF price volatility). Compare
                                     # both against the price-vol-only baseline (this whole block
                                     # disabled) as separate, clearly-labeled runs -- don't assume
                                     # either beats the baseline without checking.
    windows: [63, 252]               # rolling z-score lookback window(s) for
                                     # compute_factor_dispersion_features; matches this project's
                                     # existing convention of a ~1yr self-relative lookback
                                     # (e.g. vix_zscore_1y)
    min_symbols: 10                 # minimum symbols with a non-NaN composite_score on a given
                                     # rebalance date before that date's dispersion is trusted; see
                                     # compute_cross_sectional_dispersion docstring
  supervised:                        # Walk-forward SUPERVISED prediction of the regime label,
                                     # trained on the labels the unsupervised model already
                                     # produces -- see src/regime_detection/supervised_regime.py's
                                     # module docstring. Does NOT replace GMM/HMM: the
                                     # unsupervised model still discovers WHAT the states are,
                                     # this layer learns WHEN transitions happen. Targets the
                                     # same over-switching problem consensus_governor below
                                     # tried and failed to fix, from the opposite direction
                                     # (anticipate the change rather than smooth the label
                                     # after the fact).
                                     # Uses LightGBM when installed, else sklearn's
                                     # HistGradientBoostingClassifier (same algorithm family;
                                     # the fallback exists because LightGBM isn't installable
                                     # in the build sandbox). Which backend ran is logged.
    enabled: false                  # off by default -- NOT yet validated on real data. Note
                                     # the prior: four previous regime-side attempts
                                     # (consensus_governor, regime-conditional weighting,
                                     # factor_dispersion, and the combined-strategy interaction
                                     # effect itself) have all come back flat-to-negative.
                                     # Only used by scripts/compare_regime_feature_sets.py's
                                     # "supervised" arm; not wired into run_full_pipeline.py.
    horizon: 5                      # trading days ahead to predict. This is what makes the
                                     # model anticipatory rather than a relabelling of today.
    retrain_every: 63               # refit cadence in trading days (~1 quarter)
    min_train: 504                  # minimum training rows (~2yr) before the first prediction;
                                     # earlier rows are NaN, never backfilled with the
                                     # unsupervised label (mixing the two would make the arm a
                                     # blend of both approaches and the comparison meaningless)
    random_state: 42
                                     # HONEST CAVEAT, worth reading before interpreting any
                                     # result: the TARGET labels come from a full-history
                                     # RegimeModel.fit, exactly as the existing regime_only /
                                     # combined baseline already does. The supervised model is
                                     # trained strictly walk-forward, but its target carries
                                     # full-sample information. That keeps this comparable to
                                     # the baseline (same labels, different consumption) and
                                     # means a win here is NOT evidence of live tradability on
                                     # its own. Judge by backtest attribution, never by label
                                     # agreement/classification accuracy -- a model 85% accurate
                                     # at reproducing labels can still be worthless if the 15%
                                     # it misses are the transitions that matter.
  consensus_governor:                # Hybrid HMM + Wasserstein state governor — see
                                       # src/regime_detection/wasserstein_proximity.py and
                                       # state_governor.py; entropy-gated consensus between
                                       # the model.type posterior and Wasserstein-1 proximity
                                       # to training-time regime templates, with persistence +
                                       # hysteresis gating to reduce over-switching. Purely
                                       # additive — adds active_regime/consensus_entropy/etc.
                                       # columns, does not change regime/regime_name/p_regime_*.
    enabled: false                    # CONFIRMED NEGATIVE on real NIFTY500 data (2026-07-24 run):
                                       # governed_regime_only underperformed regime_only on CAGR
                                       # (9.2% vs 10.0%), Sharpe (0.79 vs 0.85), AND max drawdown
                                       # (-23.2% vs -20.7%) simultaneously -- worse on every axis,
                                       # not a risk/return tradeoff. Same pattern held through to
                                       # governed_combined vs combined. Likely cause: the
                                       # persistence_window/hysteresis_epsilon defaults lag both
                                       # INTO and OUT OF regime changes, costing return on both
                                       # transitions rather than smoothing genuine noise. Leave
                                       # off unless you specifically want to spend time re-tuning
                                       # entropy_limit/persistence_window/hysteresis_epsilon
                                       # against real data -- not recommended as a first priority
                                       # given the effect size found here.
    wasserstein_columns:               # null -> defaults to return_5d/21d + realized_vol_21d/63d
    wasserstein_window: 21            # rolling window (trading days) for the empirical distribution
    entropy_limit: 0.85               # bits; above this, bar is flagged "transitional"
    persistence_window: 5             # consecutive bars a new regime must lead before activating
    hysteresis_epsilon: 0.05          # required probability margin to switch active regime

fundamental_analysis:
  universe: "NIFTY500"
  as_of: null                       # null = latest available; else YYYY-MM-DD
  sector_relative: true             # z-score within sector, not across the whole universe
  dimensions:                       # toggle dimensions on/off without touching code
    valuation: true
    profitability_quality: true
    growth: true
    leverage_solvency: true
    cashflow_quality: true
    ownership_governance: true
    earnings_surprise: true
    options_earnings: true          # pre-earnings IV/skew — see metrics/options_earnings.py;
                                     # NOTE: needs option_summary_history + earnings_calendar
                                     # merged onto the snapshot upstream (run_full_pipeline.py) —
                                     # degrades to all-NaN (harmless, renormalized away) without them.
    technical_momentum: true        # Ichimoku conviction AS A SELECTION INPUT (see
                                     # metrics/technical_momentum.py) — added 2026-07-24 after two
                                     # POST-selection mechanisms (gating and reallocating an
                                     # already-built portfolio, see technical_signals.ichimoku
                                     # below) were both confirmed negative on real data despite the
                                     # underlying signal being the single best-performing standalone
                                     # component found. This tests whether the edge is a stock-
                                     # picking signal instead. NEEDS technical_signals.ichimoku.enabled
                                     # to also be true (that's what builds the conviction panel this
                                     # dimension consumes) — degrades to all-NaN (harmless,
                                     # renormalized away) if that's off, same convention as
                                     # options_earnings above.
  composite_weights:                # must sum to 1.0; validated at load time. Rebalanced
                                     # 2026-07-24 when technical_momentum was added: every other
                                     # weight scaled by 0.95, technical_momentum given 0.05 --
                                     # deliberately small, same "newest/least-validated dimension"
                                     # convention as options_earnings below.
    valuation: 0.135375
    profitability_quality: 0.1805
    growth: 0.135375
    leverage_solvency: 0.135375
    cashflow_quality: 0.135375
    ownership_governance: 0.09025
    earnings_surprise: 0.09025
    options_earnings: 0.0475        # deliberately small: newest, least-validated dimension
    technical_momentum: 0.05        # deliberately small: newest, least-validated dimension —
                                     # see the dimensions.technical_momentum comment above for why
                                     # this exists and what real-data evidence motivated it.
                                     #
                                     # *** DO NOT RAISE THIS. CONFIRMED NEGATIVE 2026-08-11. ***
                                     # An in-sample sweep (scripts/sweep_technical_momentum_weight.py,
                                     # 0.0 to 0.30) looked extremely inviting: against
                                     # fundamentals_beta_rotated it showed CAGR rising 15.2% -> 20.4%
                                     # and flagged an apparent interior optimum at 0.275. It did not
                                     # survive walk-forward (scripts/walk_forward_technical_momentum.py,
                                     # 6 ROLLING folds, target fundamentals_beta_rotated):
                                     #   - OOS CAGR better in 4/6 folds (+3.26pp mean) BUT
                                     #   - OOS Sharpe WORSE in 4/6 folds (-0.15 mean), and
                                     #   - OOS max drawdown better in only 1/6 folds.
                                     # Higher weight buys return and more than pays for it in risk.
                                     # Two details that matter more than the headline:
                                     #   1. The CAGR gain is almost entirely ONE fold. Excluding fold
                                     #      0 (2020 test window) drops the mean delta from +3.26pp to
                                     #      +0.98pp -- that single crisis year carries the result.
                                     #   2. The recent folds are uniformly NEGATIVE: folds 4 and 5
                                     #      (2024 and 2025 test windows) lost to the zero-weight
                                     #      baseline on BOTH CAGR and Sharpe. Whatever edge upweighting
                                     #      had was concentrated in 2020-21 and has been absent or
                                     #      negative since 2022. That is temporal decay, not a stable
                                     #      factor.
                                     # Selected weights scattered across folds (0.15, 0.1, 0.2, 0.3,
                                     # 0.2, 0.2) and never once landed on 0.275 -- a flat, noisy
                                     # objective surface, consistent with the in-sample "peak" being a
                                     # plateau varying by ~2bp across 0.25-0.30.
                                     # NOTE the distinction: technical_momentum is still validated as
                                     # worth INCLUDING at a small weight (that earlier walk-forward
                                     # result stands). It is upweighting that fails. Running with
                                     # --max-drawdown-floor will not rescue this: the problem is not a
                                     # breached drawdown floor, it is a bad risk-adjusted trade at
                                     # essentially every weight above baseline.
  technical_momentum_regime_conditioning:  # Added after walk-forward validation (2026-07-27) found
                                     # technical_momentum's out-of-sample edge was real on average but
                                     # concentrated unevenly across folds, with a real (if imperfect —
                                     # one flat-market fold broke the pattern) positive correlation
                                     # between edge size and how much the benchmark was trending during
                                     # that period. Ichimoku is architecturally a trend-following
                                     # signal, so this isn't shocking, but it means a single STATIC
                                     # weight either overpays for it in choppy/high-vol conditions
                                     # where it's least reliable, or underuses it when conditions are
                                     # genuinely favorable. See point_in_time.apply_regime_conditional_weight
                                     # and docs/fundamental_analysis_spec.md's technical_momentum section.
    enabled: false                  # off by default -- NOT yet validated itself; this is a NEW,
                                     # untested mechanism motivated by real evidence, not a proven fix.
                                     # Compare against the static-weight baseline (this block disabled)
                                     # with scripts/walk_forward_technical_momentum.py before trusting it.
    multipliers:                    # scales the composite_weights.technical_momentum value above,
                                     # per CURRENT regime at each rebalance date, before rebalancing the
                                     # rest to compensate. Regime labels must match
                                     # regime_detection.models.REGIME_LABELS_4 (or your model's n_regimes
                                     # mapping) -- any regime not listed here falls back to 1.0 (no
                                     # adjustment), logged, rather than silently guessing an extreme.
      low_vol_calm: 1.0              # full weight -- calm/trending conditions are where the walk-forward
                                     # evidence was strongest
      moderate_vol: 0.6
      elevated_vol: 0.3
      high_vol_stress: 0.0          # zero weight during high-vol stress -- exactly the kind of
                                     # condition where a trend-following signal is least trustworthy
  technical_momentum_beta_orthogonalization:  # Added after walk-forward validation found the
                                     # Ichimoku conviction score's edge correlates with benchmark
                                     # trend strength (rho ~ 0.66) but imperfectly -- part of the
                                     # raw score is plain systematic market-beta momentum, part is
                                     # idiosyncratic stock-specific conviction. This cross-
                                     # sectionally residualizes conviction against trailing beta at
                                     # each rebalance date (see
                                     # src/fundamental_analysis/orthogonalization.py) before it
                                     # enters the technical_momentum dimension. Deliberately does
                                     # NOT also residualize against sector -- sector effects are
                                     # already handled downstream by
                                     # scoring.composite_score.sector_relative_zscore; doing it
                                     # again here would be redundant, not extra-safe.
    enabled: false                  # off by default -- NOT yet validated on real data; this is a
                                     # NEW, untested mechanism. Requires beta_panel to be built and
                                     # passed to run_pit_fundamental_pipeline (see
                                     # orthogonalization.compute_rolling_beta_panel) -- degrades to
                                     # exact pre-orthogonalization behavior if beta_panel is None
                                     # regardless of this flag, so this flag alone (without wiring
                                     # beta_panel into your run script) does nothing yet.
    beta_window: 252                # trailing trading days for the rolling beta estimate
    min_obs: 10                     # minimum symbols with both a score and a beta needed to run
                                     # the cross-sectional regression on a given date; below this,
                                     # that date's scores pass through unresidualized (see
                                     # orthogonalization.residualize_against_beta docstring)
  forensic_gates:                    # Hard PRE-FILTER exclusion gates, applied BEFORE quantile
                                     # ranking rather than as a soft scoring input -- see
                                     # src/fundamental_analysis/forensic_gates.py's module
                                     # docstring for the full motivation (fundamentals-only
                                     # drawdown has been worse than the raw benchmark's in every
                                     # real-data run so far, -44.56% vs -38%, even after the
                                     # Altman-NaN and negative-equity-ROE fixes -- linear rank
                                     # aggregation lets a bad governance/accrual reading be
                                     # outweighed by a good valuation/growth reading, which this
                                     # is meant to put a hard floor under).
    enabled: false                  # off by default -- NOT yet validated on real data; this is a
                                     # NEW, untested mechanism. An overly aggressive threshold can
                                     # shrink the eligible universe enough to break
                                     # min_positions/sector-cap assumptions downstream -- watch the
                                     # per-gate trip-count log line before trusting a result.
    promoter_pledge_threshold_pct: 50.0   # matches this project's existing soft-flag convention
                                     # (ownership_governance.HIGH_PLEDGE_THRESHOLD_PCT), NOT the
                                     # lower ~20% figure sometimes cited in generic literature --
                                     # left at the already-established value rather than
                                     # second-guessed without evidence.
    accrual_ratio_threshold: 0.10   # (net_income - cfo) / total_assets; Sloan (1996) convention
    piotroski_max_score_for_exclusion: 3   # exclude if Piotroski F-score <= this (0-9 scale)
    piotroski_min_coverage: 6       # only apply the Piotroski gate when at least this many of
                                     # the 9 signals were actually computable that row -- avoids
                                     # excluding a stock for "low score" that's really just
                                     # sparse data (see forensic_gates.piotroski_operational_gate)
                                     # NOTE: the related_party_transaction gate has no threshold --
                                     # it uses only the boolean related_party_transactions_flag,
                                     # since the continuous RPT-transactions/sales intensity ratio
                                     # a fuller forensic screen would use isn't available from any
                                     # of Screener/yfinance/Trendlyne (see
                                     # docs/data_sourcing_spec.md). Reduced-fidelity substitute,
                                     # not the full formula -- see forensic_gates.py's docstring.
  point_in_time:                    # see src/fundamental_analysis/point_in_time.py
    enabled: true
    reporting_lag_days: 45          # SEBI LODR Reg. 33 filing deadline used as the
                                     # conservative "known as of" heuristic — see
                                     # screener_fetcher.fetch_quarterly_history docstring
    quarterly_history_path: "data/raw/fundamentals_quarterly_history.csv"
    rebalance_frequency: "MS"       # pandas offset alias: MS=month start. Used to build
                                     # the rebalance-date schedule for scores_by_date.

data_fetchers:
  price_source: "yfinance"          # only supported price source currently
  price_start_date: "2015-01-01"    # the single biggest lever for MORE (genuinely independent, not
                                     # just overlapping) walk-forward folds is pushing this earlier if
                                     # the underlying data supports it -- India VIX (^INDIAVIX) has
                                     # published history back to late 2007 on NSE, though yfinance's
                                     # own backfill depth for it specifically should be spot-checked
                                     # (see yfinance_fetcher.fetch_india_vix_series's docstring)
                                     # before relying on an earlier date here. NIFTY500-constituent
                                     # stock-level price history is the more likely binding
                                     # constraint -- many current constituents won't have listed
                                     # history reaching much before 2015 anyway.
  benchmark_ticker: "^CRSLDX"       # NIFTY500 Total Return proxy on Yahoo Finance — verify before relying on it
  vix_ticker: "^INDIAVIX"           # India VIX -- feeds the production regime source (see
                                     # regime_detection.production_regime_source, default
                                     # "vix_bucket_contemporaneous"). Fetched via
                                     # yfinance_fetcher.fetch_india_vix_series; NOT the same code
                                     # path as regime_detection.data_loader.load_from_yfinance
                                     # (which bundles VIX together with the benchmark index
                                     # download, for the GMM regime feature matrix specifically) --
                                     # this ticker is fetched standalone so the two stay decoupled.
  fundamentals:
    sources: ["screener", "yfinance"]   # which sources to query -- trendlyne dropped in the
                                       # lean build (supplementary only; most useful fields
                                       # were paywalled anyway)
    source_priority: ["screener", "yfinance"]  # field-level fallback order when merging
    min_delay_seconds: 2.0          # politeness delay between requests to the same domain
    cache_dir: "data/raw/.cache"
    cache_ttl_days: 7
  options:                          # see src/fundamental_analysis/data_fetchers/options_fetcher.py —
                                     # NO free bulk NSE options source is wired in; this section only
                                     # controls where run_full_pipeline.py looks for/caches a
                                     # pre-built option_summary_history + earnings_calendar CSV.
    enabled: false
    option_summary_history_path: "data/raw/option_summary_history.csv"
    earnings_calendar_path: "data/raw/earnings_calendar.csv"
    pre_earnings_window_days: 5
    max_lookback_days: 10
    iv_percentile_lookback_days: 252

sentiment_analysis:
  enabled: false                    # intentionally out of scope for this pass

technical_signals:
  conviction_source: "blend"        # WHICH signal feeds the technical_momentum dimension.
                                     #   "ichimoku" -- historical default
                                     #   "mom121"   -- plain 12-1 momentum
                                     #   "blend"    -- 12-1 momentum blended with mean reversion,
                                     #                 weighted by market stress  <- CURRENT
                                     #
                                     # *** WHY THE DEFAULT CHANGED (2026-08-13). ***
                                     # A direct information-coefficient measurement
                                     # (scripts/diagnose_signal_ic_by_regime.py) found the Ichimoku
                                     # conviction score has essentially NO cross-sectional
                                     # predictive power on this universe: IC -0.0010, t = -0.10,
                                     # correct sign on 49.6% of rebalance dates -- a coin flip.
                                     # Plain 12-1 momentum measured IC +0.0383, t = 2.88.
                                     # Walk-forward (6 rolling folds, 17bps) confirmed it:
                                     #   ichimoku_only  -> mom121_only:  Sharpe +0.156 in 6/6 folds,
                                     #                     CAGR +0.024 in 6/6, and LOWER turnover
                                     #                     (4.25x vs 4.80x annualized).
                                     #   mom121_only    -> blend:        Sharpe +0.053 in 5/6 folds,
                                     #                     CAGR +0.011.
                                     # Note this does NOT mean the earlier walk-forward validation
                                     # of the Ichimoku dimension was wrong. That test compared it
                                     # against a ZERO-weight baseline -- "something beats nothing"
                                     # -- and never against a competing signal. It answered a
                                     # weaker question than it appeared to.
                                     # HONEST CAVEAT: roughly three quarters of the total gain comes
                                     # from the SIGNAL SWAP, not from blending. Blending is a real
                                     # but modest addition (+0.053 Sharpe, 5/6 folds) and its
                                     # drawdown effect is weak (3/6 folds). This is a RETURN
                                     # improvement, not a risk improvement.
  blend:                             # only used when conviction_source: "blend"
    reversal_kind: "dist_from_ma"   # negative z-score of price vs its own 63d moving average.
                                     # Preferred over "short_term" because it had better sample
                                     # support in the IC diagnostic (25-31 dates in the elevated
                                     # regime vs 4 in the stressed one) and does not share its
                                     # lookback with the monthly rebalance interval.
    ma_window: 63
    stress_mode: "rigid"            # WHICH stress SOURCE weights the momentum/reversal blend.
                                     # "rigid"       = the regime_detection.production_regime_source
                                     #                 series' own ladder (see that config block
                                     #                 above) -- VIX-bucket regime by default as of
                                     #                 this build. <- CURRENT
                                     # "continuous"  = rolling percentile of trailing REALIZED
                                     #                 volatility (smooth, uses every date),
                                     #                 independent of whichever regime source is
                                     #                 configured above.
                                     #
                                     # Walk-forward on the ORIGINAL GMM-only "rigid" vs "continuous"
                                     # comparison could not separate them (mean Sharpe deltas
                                     # +0.036/+0.020, a coin flip either way). The VIX-bucket regime
                                     # (see regime_detection.production_regime_source) is a
                                     # different, later, and better-evidenced result: walk-forward
                                     # testing against the GMM regime showed a real (if modest,
                                     # small-n) edge -- see docs/regime_detection_spec.md's
                                     # "VIX-bucket regime" section for the full writeup, including
                                     # what was tried and NOT chosen (a VIX-forecasting classifier
                                     # arm, a GMM+VIX hybrid gate) and the caveat on how far the
                                     # hysteresis parameter can be pushed before results stop
                                     # generalizing.
    vol_window: 21                  # trailing window for the realized-volatility stress measure
                                     # (only used when stress_mode: "continuous")
    max_reversal_weight: 1.0        # reversal weight at maximum stress. 1.0 = full flip to pure
                                     # reversal at peak stress, which is what the measured IC sign
                                     # flip implies (momentum IC goes NEGATIVE under stress:
                                     # -0.125 for ichimoku, -0.095 for 12-1, while reversal goes
                                     # +0.107 to +0.145). Lower values tilt without inverting --
                                     # worth testing, since the full flip leans on the thin
                                     # stressed bucket.

backtesting:
  # NOTE: the `ichimoku` block was removed from technical_signals in the lean build. The signal measured
  # IC -0.0010 (t = -0.10) versus 12-1 momentum's +0.0383 (t = 2.88) and lost on 6/6
  # walk-forward folds, so its modules and its OHLC fetch are gone. `conviction_source`
  # above is the replacement. data/raw/stock_prices_ohlc_long.csv is no longer used.
  engine: "vectorbt"                # "vectorbt" (default) or "custom" — see
                                     # src/backtesting/vbt_engine.py. Falls back to
                                     # the custom engine.py automatically (with a
                                     # logged warning) if vectorbt isn't installed.
  top_quantile: 0.2                 # fraction of the universe held long, by composite_score
  min_positions: 5                  # floor on position count regardless of top_quantile x universe size
  max_sector_weight: 0.30           # NEW 2026-07-27: caps any single sector at this fraction of the
                                     # fundamentals selection -- addresses a real, previously-unaddressed
                                     # problem: fundamentals_only's max drawdown has consistently been
                                     # WORSE than the raw benchmark's across every real run so far
                                     # (e.g. -45% vs -38%), a sector-concentration signature. Greedy,
                                     # rank-preserving: a capped sector's excess candidates are skipped
                                     # in favor of the next-best idea from elsewhere, not dropped outright
                                     # -- see strategies.build_fundamental_portfolio_weights. Set to null
                                     # to disable (exact pre-cap behavior).
  max_position_weight: null         # caps any single symbol's weight. With the current equal-weighting
                                     # scheme this only bites if min_positions is small enough that
                                     # 1/min_positions alone exceeds the cap -- mostly future-proofing
                                     # for if/when position sizing stops being purely equal-weighted.
                                     # null (default) = no cap.
  transaction_cost_bps: 10          # one-way cost in bps, charged on daily turnover
  lag_days: 1                       # trading days between a weight being "decided" (using
                                     # data through that day's close) and it earning returns.
                                     # Default 1 -- the standard no-look-ahead convention; a
                                     # signal computed using day T's close cannot be acted on
                                     # until day T+1 (you can't observe today's close before
                                     # today ends). Do NOT set to 0 without a specific reason
                                     # (e.g. weights already lagged upstream) -- see
                                     # src/backtesting/engine.py's run_backtest docstring for
                                     # the same-day-spike bug this prevents.
  beta_rotation:                     # COMPOSITIONAL de-risking -- see
                                     # strategies.apply_beta_rotation's docstring. Adds a
                                     # `fundamentals_beta_rotated` component when a beta_panel is
                                     # passed to run_backtest_pipeline; `combined` is never
                                     # modified by this.
                                     #
                                     # *** CONFIRMED POSITIVE, WALK-FORWARD VALIDATED. ***
                                     # The first regime-side mechanism on this project to survive
                                     # out-of-sample testing, after SIX label-focused attempts
                                     # failed (consensus_governor, factor_dispersion, supervised
                                     # regime prediction, regime-conditional technical_momentum
                                     # weighting, adaptive-Ichimoku period driving, and the
                                     # combined-strategy interaction effect itself).
                                     #
                                     # WHY IT WORKS WHERE THOSE DIDN'T: all six changed the regime
                                     # LABEL -- smoothed it, refit it on different features,
                                     # predicted it with a gradient-boosted tree -- while the
                                     # CONSUMPTION mechanism never changed once: a single scalar
                                     # exposure multiplier applied uniformly to every holding.
                                     # One degree of freedom, one failure mode. This changes the
                                     # consumption instead: stay 100% invested ALWAYS and de-risk
                                     # by rotating toward low-beta names within the existing
                                     # selection. Total exposure is preserved to machine precision
                                     # every day (verified 2.22e-16), which makes the diagnosed
                                     # Cov(E_t, R_p) < 0 rebound drag structurally impossible --
                                     # E_t is constant. The regime label was never the bottleneck.
    rotation_strength: 3.0          # relative weight moved per standard deviation of beta spread,
                                     # AT FULL STRESS. Calm regimes have stress=0, so this is an
                                     # exact no-op there regardless of the value.
                                     #
                                     # WHY 3.0 -- two independent criteria converged on it in
                                     # scripts/sweep_beta_rotation_strength.py (0.0..10.0 grid):
                                     #   (a) it is the LAST strength still flagged "still a tilt"
                                     #       rather than "CONCENTRATION BET" (effective_n 50.9 of
                                     #       an unrotated 100.0, 28% of held names floored to
                                     #       zero). 4.0+ breaches the 50%-breadth floor.
                                     #   (b) it is the DRAWDOWN MINIMUM (-32.60% @17bps); 4.0
                                     #       onward gets worse again.
                                     # Sharpe keeps rising past 3.0 (to 1.1188 at strength 10),
                                     # so 3.0 is optimal only once you refuse to buy Sharpe with
                                     # breadth. That refusal is deliberate: this mechanism's
                                     # asymptote is a |z|-weighted book over the below-average-beta
                                     # HALF of the selection, which can post a fine backtest
                                     # drawdown while being a materially less diversified thing
                                     # than the selection engine actually chose. Drawdown alone
                                     # cannot detect that failure mode -- watch effective_n.
                                     #
                                     # WALK-FORWARD EVIDENCE (scripts/walk_forward_beta_rotation.py,
                                     # 6 ROLLING folds, 5yr train / 1yr test, 17bps one-way):
                                     #   - Selected 3.0 in 5/6 folds (fold 1 picked 2.0, where the
                                     #     train-window breadth guard had excluded 3.0 -- so 3.0
                                     #     was offered in 5 folds and won all 5). std 0.41.
                                     #     Rolling folds matter here: folds 1 and 6 share NO
                                     #     training data and still landed adjacent.
                                     #   - OOS max drawdown better in 5/6 folds (mean +0.98pp)
                                     #   - OOS Sharpe better in 4/6 folds (mean +0.182)
                                     #   - OOS CAGR better in 3/6 folds (mean +0.33pp) -- a coin
                                     #     flip, which is the CORRECT shape: this is a risk
                                     #     mechanism, not a return mechanism.
                                     #
                                     # HONEST CAVEAT ON THE SHARPE NUMBER: the +0.182 mean is NOT
                                     # "typically +0.182". It is driven by a minority of folds --
                                     # fold 1 (2020, COVID) alone contributes +0.42, while folds 3
                                     # and 6 are slightly NEGATIVE. Calm folds are near-identical
                                     # to baseline (fold 4 matched to 4dp). That concentration is
                                     # expected and arguably reassuring for a tail-risk mechanism:
                                     # it did its best work in the fold with the most actual
                                     # stress. But describe it as tail protection, not as a broad
                                     # improvement.
                                     #
                                     # BEFORE TRUSTING IN DEPLOYMENT:
                                     #   1. Turnover is 3.26x annualized at strength 3.0 vs 1.03x
                                     #      unrotated. Execution quality matters more here than
                                     #      anywhere else in this strategy -- re-run at a higher
                                     #      cost if real fills are worse than 17bps one-way.
                                     #   2. Re-run with --test-years 2 to check fold 1's outsized
                                     #      contribution survives when 2020 is not a fold of its own.
    stress_by_regime: null          # regime label -> stress level in [0,1]. null (default) =
                                     # linear ramp over observed labels (calmest 0.0 -> most
                                     # stressed 1.0). Deliberately NOT the same numbers as
                                     # exposure_by_regime above: that says how much to DISINVEST,
                                     # this says how hard to ROTATE. Conflating them would make the
                                     # two mechanisms look more comparable than they are.
  report_components:                 # which components appear in the printed summary and the
                                     # report. The full decomposition is ALWAYS written to
                                     # reports/tables/attribution_table_full.csv regardless -- this
                                     # only controls what is surfaced.
                                     # benchmark              buy and hold the index
                                     # fundamentals_beta_rotated  THE STRATEGY: score-selected,
                                     #                        always fully invested, de-risked by
                                     #                        rotating toward low beta under stress
                                     # The three hidden by default are diagnostics:
                                     # fundamentals_only      selection with no de-risking at all
                                     # regime_only            exposure timing with no selection
                                     # combined               selection + exposure CUTTING, the
                                     #                        mechanism beta rotation superseded
                                     # Restore the full list if something needs explaining -- that
                                     # decomposition is what exposed the negative interaction
                                     # effect between exposure timing and stock selection.
    - benchmark
    - fundamentals_beta_rotated
  poster_charts: true                # writes two large benchmark-vs-strategy PNGs to
                                     # reports/poster/ (equity curve, rolling Sharpe) --
                                     # see src/backtesting/poster_charts.py
  report_components:                 # which components appear in the printed summary and the
                                     # markdown report. The FULL decomposition is always written to
                                     # reports/tables/attribution_table_full.csv regardless; this
                                     # only controls what is surfaced.
                                     #   benchmark                 buy and hold the index
                                     #   fundamentals_beta_rotated THE STRATEGY: score-selected,
                                     #                             always fully invested, de-risked
                                     #                             by rotating toward low beta
                                     #                             under stress
                                     # The three hidden by default are DIAGNOSTICS, not failures:
                                     #   fundamentals_only  selection with no de-risking
                                     #   regime_only        exposure timing with no selection
                                     #   combined           selection + exposure CUTTING, the
                                     #                      mechanism beta rotation superseded
                                     # Restore the full list when something needs explaining --
                                     # that decomposition is what exposed the negative interaction
                                     # effect between exposure timing and stock selection.
    - benchmark
    - fundamentals_beta_rotated
  rolling_sharpe_window: 63         # trading days (~1 quarter)
  exposure_by_regime:                # benchmark exposure fraction per regime label (0=calmest)
    0: 1.00                          # low-vol calm      -> fully invested
    1: 0.85                          # moderate vol       -> slightly de-risked
    2: 0.55                          # elevated vol        -> materially de-risked
    3: 0.25                          # high-vol stress       -> mostly in cash
    transitional: 0.25               # only used by governed_regime_only/governed_combined (see
                                       # attribution.py) when regime_detection.consensus_governor
                                       # is enabled -- active_regime can be the string
                                       # "transitional" on ambiguous/high-entropy bars, which has
                                       # no int key above. Per the research doc's "Transitional"
                                       # target row (0.25x). If omitted, defaults to full (1.0)
                                       # exposure with a logged warning -- see
                                       # strategies.build_regime_exposure_weights.
  geometric_crash_exposure_multiplier: 0.5  # exposure cut applied ONLY on days the geometric
                                             # wedge-product crash-risk flag is active (see
                                             # regime_detection.geometric_signal above) — applied
                                             # as a standalone overlay (geometric_overlay_only
                                             # component) AND on top of `combined`, independent of
                                             # the GMM regime label. No effect if the signal is
                                             # disabled. See src/backtesting/strategies.py.
  report_dir: "reports"

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
